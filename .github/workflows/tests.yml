name: Tests

on: [push, pull_request]

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx_compiler: g++-14
            c_compiler: gcc-14
            omp: ON
            
          - os: ubuntu-latest
            cxx_compiler: clang++
            c_compiler: clang
            omp: ON
            
          - os: ubuntu-24.04-arm
            cxx_compiler: g++-14
            c_compiler: gcc-14
            omp: ON
            architecture: arm64
            
          - os: ubuntu-24.04-arm
            cxx_compiler: clang++
            c_compiler: clang
            omp: ON
            architecture: arm64
            
# macos-latest = macos-15 is currently incompatible with Homebrew gcc;
# see https://github.com/actions/runner-images/issues/12745.
# For now, use macos-14.

#         - os: macos-latest
          - os: macos-14
            cxx_compiler: g++-13
            c_compiler: gcc-13
            omp: ON

          - os: macos-latest
            cxx_compiler: clang++
            c_compiler: clang
            omp: OFF

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.x'
          architecture: ${{ matrix.architecture || 'x64' }}

      - name: Install zfpy dependencies
        run: |
          python -m pip install cython
          python -m pip install oldest-supported-numpy
          python -m pip install setuptools
          python -m pip install packaging
      
      - name: Setup OpenMP (Linux)
        if: ${{(matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm') && matrix.cxx_compiler == 'clang++'}}
        run: sudo apt-get update; sudo apt-get install -y libomp5 libomp-dev

      - name: Setup OpenMP (MacOS)
        if: ${{(matrix.os == 'macos-latest' || matrix.os == 'macos-14')}}
        run: |
          brew install libomp
          echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV
          echo "LDFLAGS=\"-L$(brew --prefix llvm)/lib\"" >> $GITHUB_ENV
          echo "CPPFLAGS=\"-I$(brew --prefix llvm)/include\"" >> $GITHUB_ENV

      - name: Run Configure, Build, Test
        run: |
          if [[ "${GITHUB_REF}" == "develop" ]] ; then
            BUILD_GROUP="Continuous";
          else
            BUILD_GROUP="Experimental";
          fi

          ctest -S cmake/github_actions.cmake \
            -VV \
            -j 4 \
            -C ${{env.BUILD_TYPE}} \
            -D CTEST_SITE="GitHub Actions" \
            -D CTEST_BUILD_NAME="${{matrix.os}}-${{matrix.cxx_compiler}}-${{matrix.architecture || 'x64'}}" \
            -D BUILD_GROUP="${BUILD_GROUP}" \
            -D CXX_COMPILER=${{matrix.cxx_compiler}} \
            -D C_COMPILER=${{matrix.c_compiler}} \
            -D OMP_SETTING=${{matrix.omp}}